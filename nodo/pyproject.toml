[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faronet"
version = "0.1.0"
description = "Nodos de la mesh anonima FaroNet (capas 2, 3 y 7)"
requires-python = ">=3.10"
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
faro = ["dispositivo-luz-adaptador"]

[project.scripts]
faronet = "faronet.cli:main"

[tool.setuptools]
packages = ["faronet"]
